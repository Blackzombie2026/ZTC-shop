name: Deploy ZTC Shop to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -- --base=/ZTC-shop/
        env:
          # Clé publique Supabase (safe en front, protégée par RLS).
          # Ne JAMAIS mettre de mot de passe ou de clé service_role ici.
          VITE_SUPABASE_URL: https://ytdgkvzzcqjaijcbupfp.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl0ZGdrdnp6Y3FqYWlqY2J1cGZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3Mzk0MzQsImV4cCI6MjEwNTMxNTQzNH0.McF-7NUw7kDqc4URkwD4gXbZfkAmLzURRlZVW45DsbU
          VITE_ADMIN_EMAIL: admin@ztc.shop
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
